# Verify a pushed BRANCH (no deploy, no release tag): the same test shards as deploy.yml (one copy: tests.yml), run remotely so the heavy proof does not need this
# machine (research/PROPOSAL-BRANCH-CI.md, approved by the user 2026-11-03). A chat opts in by pushing `ci/<name>`; ordinary WIP branches cost nothing.
# 0 failed AND 0 flaky: tools/test.sh retries a failing test once and calls a pass-on-retry FLAKY (a warning, exit 0). This workflow fails the shard when the runner
# reports ANY flaky test, so tools/test.sh itself is NOT changed (it is a gate-harness file, and main's CI keeps its retry-once behaviour).
# The answer is a MARKER TAG on the commit: `ci-ok-<sha7>` or `ci-fail-<sha7>`; read it with `git ls-remote --tags origin 'ci-*-<sha7>'` (a git call, zero REST API quota).
name: Verify branch (no deploy)

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}   # NOT 'pages': this must never cancel, or be cancelled by, the main run
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    with:
      strict_flaky: true   # 0 failed AND 0 flaky: a pass-on-retry fails the shard (the runner reports it; tools/test.sh stays as it is)

  # The machine-readable answer. Runs even when `test` failed. A cancelled or skipped `test` (a newer push replaced this run) gives NO marker: no answer is not a "fail".
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write the marker tag
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          S="${GITHUB_SHA::7}"
          case "$RESULT" in
            success) T="ci-ok-$S";   O="ci-fail-$S" ;;
            failure) T="ci-fail-$S"; O="ci-ok-$S" ;;
            *) echo "test result '$RESULT': no marker"; exit 0 ;;
          esac
          git push origin ":refs/tags/$O" 2>/dev/null || true   # the latest answer wins for a re-run of the same commit
          git tag -f "$T" && git push -f origin "refs/tags/$T"
          echo "marker $T written"
