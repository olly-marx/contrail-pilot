# Test the game in a real browser, then publish it to GitHub Pages.
# A failing test stops the deploy, so the live game is never broken.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 4 machines side by side (2026-10-22: one machine took 12-15 min). tools/test.sh runs every test
  # in its shard, retries a failure once (passing on retry = a FLAKY warning, not a failure) and
  # prints one summary. fail-fast off: every shard reports, so one run shows everything wrong.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test driver
        run: npm i --no-save playwright-core@1
      - name: Serve the game
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        env:
          CHROME: /usr/bin/google-chrome
        run: tools/test.sh --shard ${{ matrix.shard }}/4

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the site (game files only)
        run: |
          mkdir _site
          cp -r index.html style.css .nojekyll src assets vendor _site/
          # Stamp every script/style URL with this commit. Pages lets browsers keep files for 10 min,
          # so without this a phone could run a new index.html with OLD scripts (new buttons, dead).
          V=${GITHUB_SHA::7}
          sed -i -E "s#(from '\./[A-Za-z]+\.js)'#\1?v=$V'#g" _site/src/*.js
          sed -i -E "s#(src|href)=\"(src/main\.js|src/newplayer\.js|style\.css|vendor/[a-z.]+\.js)\"#\1=\"\2?v=$V\"#g" _site/index.html
          grep -q "src/main.js?v=$V" _site/index.html   # fail the deploy if the stamp didn't take
          # version.json: what's live, read by src/updates.js to offer the update. tools/check-release.py stops
          # the deploy unless src/version.js (semver) and the top entry of CHANGES.json agree (RELEASING.md).
          python3 tools/check-release.py --write _site/version.json "$V"
          grep -q "\"commit\": \"$V\"" _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a good deploy, tag the commit with its version (v0.9.1). Not part of the deploy: a failure here
  # leaves the live game alone. A version that already has a tag is left as it is (a deploy of a non-release commit).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          V=$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/version.js)
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then echo "v$V already tagged"; exit 0; fi
          git tag "v$V" && git push origin "v$V"
