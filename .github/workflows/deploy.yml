# Test the game in a real browser, then publish it to GitHub Pages.
# A failing test stops the deploy, so the live game is never broken.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 4 machines side by side (2026-10-22: one machine took 12-15 min). tools/test.sh runs every test
  # in its shard, retries a failure once (passing on retry = a FLAKY warning, not a failure) and
  # prints one summary. fail-fast off: every shard reports, so one run shows everything wrong.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test driver
        run: npm i --no-save playwright-core@1
      - name: Serve the game
        run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        env:
          CHROME: /usr/bin/google-chrome
        run: tools/test.sh --shard ${{ matrix.shard }}/4

  # The PREVIEW of the redesign (branch `redesign`, served at /preview/; tools/build-preview.sh). STRICTLY non-blocking:
  # continue-on-error, `deploy` below does not need it to succeed, and any failure here only costs the preview.
  # A failure is NOT silent: the last step turns it into a warning annotation on the run.
  preview-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: has
        name: Is there a redesign branch?
        run: |
          if git ls-remote --exit-code --heads origin redesign >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Preview::no redesign branch on origin: no preview this time"; echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: redesign
          path: redesign
      - if: steps.has.outputs.exists == 'true'
        name: Build the preview
        run: tools/build-preview.sh redesign preview-out "$(git -C redesign rev-parse --short=7 HEAD)"
      - if: steps.has.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview-out
          if-no-files-found: error
      - if: failure()
        run: echo "::warning title=Preview::the preview build FAILED, so /preview/ is missing or stale. The live game is unaffected."

  deploy:
    needs: [test, preview-bundle]
    # preview-bundle may fail or be skipped without stopping the live game; only the tests gate it
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the site (game files only)
        run: |
          mkdir _site
          cp -r index.html style.css .nojekyll src assets vendor _site/
          # Stamp every script/style URL with this commit. Pages lets browsers keep files for 10 min,
          # so without this a phone could run a new index.html with OLD scripts (new buttons, dead).
          V=${GITHUB_SHA::7}
          sed -i -E "s#(from '\./[A-Za-z]+\.js)'#\1?v=$V'#g" _site/src/*.js
          sed -i -E "s#(src|href)=\"(src/main\.js|src/newplayer\.js|style\.css|vendor/[a-z.]+\.js)\"#\1=\"\2?v=$V\"#g" _site/index.html
          grep -q "src/main.js?v=$V" _site/index.html   # fail the deploy if the stamp didn't take
          # version.json: what's live, read by src/updates.js to offer the update. tools/check-release.py stops
          # the deploy unless src/version.js (semver) and the top entry of CHANGES.json agree (RELEASING.md).
          python3 tools/check-release.py --write _site/version.json "$V"
          grep -q "\"commit\": \"$V\"" _site/version.json
      # Optional: the preview built above. Nothing below may fail the deploy.
      - id: pv
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: preview
          path: _site/preview
      - if: steps.pv.outcome != 'success'
        run: echo "::warning title=Preview::no preview in this deploy (/preview/ will not exist or will be removed). The live game is unaffected."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a good deploy, tag the commit with its version (v0.9.1). Not part of the deploy: a failure here
  # leaves the live game alone. A version that already has a tag is left as it is (a deploy of a non-release commit).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          V=$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/version.js)
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then echo "v$V already tagged"; exit 0; fi
          git tag "v$V" && git push origin "v$V"
