# The phone apps, built from the SAME commit the web deploy just published (Oliver, 2026-11-20: web, iOS and Android "should all ship together"):
#   ios      GitHub's Mac runner builds the iPhone app and sends it to TestFlight (internal testers only; no store release, no review).
#   android  a Linux runner builds the Android app (a debug build, kept 14 days as an artifact) until the Play upload key exists; then it uploads to internal testing.
# When: after "Test and deploy" SUCCEEDS on main (so an app is never built from a commit whose tests failed or that is not live), on a push to app/** (trying
# the app alone), or by hand.
# Signing: Xcode automatic signing with the App Store Connect API key (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64);
# no certificates are kept anywhere. The web files are the same bundle as the web deploy (tools/make-app.sh -> tools/make-site.sh).
name: Phone apps (TestFlight, Android)

on:
  workflow_run:
    workflows: ['Test and deploy']
    types: [completed]
    branches: [main]
  push:
    branches: ['app/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  TEAM_ID: 9SR6FGGBQC
  BUNDLE_ID: com.olivermarx.flightgame

jobs:
  testflight:
    # after a deploy: only a SUCCESSFUL main run (a failed or cancelled test never ships an app)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: No keys in the repo
        run: tools/no-keys.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GNU sed (tools/make-site.sh is written for Linux sed; macOS sed rejects its patterns)
        run: |
          brew install gnu-sed
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Web files into the app
        run: |
          cd native && npm ci
          SHA=$(git rev-parse --short=7 HEAD)
          cd .. && bash tools/make-app.sh "$SHA"
          cd native && npx cap sync ios
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "${{ secrets.ASC_KEY_P8_B64 }}" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (version from src/version.js, build number = this run)
        run: |
          V=$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/version.js)
          echo "version $V build ${{ github.run_number }}"
          xcodebuild -version
          xcodebuild archive \
            -project native/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Export and upload to App Store Connect (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  android:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: No keys in the repo
        run: tools/no-keys.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web files into the app
        run: |
          cd native && npm ci
          cd .. && bash tools/make-app.sh "$(git rev-parse --short=7 HEAD)"
          cd native && npx cap sync android
      - name: Build (debug; the release build waits for the Play upload key)
        run: |
          V=$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/version.js)
          cd native/android && ./gradlew --no-daemon -q assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/contrail-pilot-$V-${{ github.run_number }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ runner.temp }}/*.apk
          retention-days: 14
